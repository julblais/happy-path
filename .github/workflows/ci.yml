on: 
  - pull_request
  - workflow_call
jobs:
  Build-web-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v4.3
        with:
          dotnet-version: 9.x
      - name: Install wasm
        run: dotnet workload install wasm-tools
      - name: Publish .NET Core Project
        run: dotnet publish HappyPath/HappyPath.csproj -c Release -o release --nologo
      # Upload artifacts
      - name: Send Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webApp
          path: |
            ./release/